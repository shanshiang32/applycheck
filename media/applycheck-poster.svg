<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="ApplyCheck 投前核验 · 20 个真实岗位结果总览">
  <title>ApplyCheck / 投前核验 · 结果总览</title>
  <desc>20 个真实岗位统一重分析：17 岗明确条件不匹配、3 岗信息不足待复核、0 岗已识别硬条件匹配。固定画像：硕士、2025 年已毕业、非在校、可连续实习 6 个月、每周 5 天。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3169ce"/>
      <stop offset="1" stop-color="#5b8ee6"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17243a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 顶部品牌 -->
  <text x="128" y="86" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#3169ce">APPLYCHECK / 投前核验</text>
  <rect x="128" y="104" width="96" height="4" rx="2" fill="url(#accent)"/>

  <!-- 主标题 -->
  <text x="128" y="208" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="74" font-weight="700" fill="#17243a">20 个真实岗位 · 统一重分析</text>
  <text x="128" y="262" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" fill="#6b7b93">字节跳动 16 · 美团 4 · 同一份画像与规则 0.1.13 离线重算 · 条件初筛 ≠ 整体求职资格</text>

  <!-- 三个结果卡片 -->
  <g filter="url(#sh)">
    <rect x="128" y="316" width="516" height="300" rx="22" fill="#ffffff" stroke="#dde5ef"/>
    <rect x="686" y="316" width="516" height="300" rx="22" fill="#ffffff" stroke="#dde5ef"/>
    <rect x="1244" y="316" width="516" height="300" rx="22" fill="#ffffff" stroke="#dde5ef"/>
  </g>

  <text x="176" y="474" font-family="Cascadia Mono, Consolas, monospace" font-size="150" font-weight="700" fill="#b3261e">17</text>
  <text x="176" y="536" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" fill="#4c5b73">明确条件不匹配</text>
  <rect x="176" y="562" width="420" height="14" rx="7" fill="#f0d5d3"/>
  <rect x="176" y="562" width="386" height="14" rx="7" fill="#b3261e"/>

  <text x="734" y="474" font-family="Cascadia Mono, Consolas, monospace" font-size="150" font-weight="700" fill="#a56a00">3</text>
  <text x="734" y="536" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" fill="#4c5b73">信息不足，待复核</text>
  <rect x="734" y="562" width="420" height="14" rx="7" fill="#f7ead0"/>
  <rect x="734" y="562" width="71" height="14" rx="7" fill="#a56a00"/>

  <text x="1292" y="474" font-family="Cascadia Mono, Consolas, monospace" font-size="150" font-weight="700" fill="#1a7f45">0</text>
  <text x="1292" y="536" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" fill="#4c5b73">已识别硬条件匹配</text>
  <rect x="1292" y="562" width="420" height="14" rx="7" fill="#dcefe3"/>
  <rect x="1292" y="562" width="10" height="14" rx="7" fill="#1a7f45"/>

  <!-- 画像与判定原则 -->
  <g filter="url(#sh)">
    <rect x="128" y="656" width="1632" height="278" rx="22" fill="#ffffff" stroke="#dde5ef"/>
  </g>
  <text x="176" y="712" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#215ec4">固定测试画像</text>
  <text x="176" y="762" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" fill="#17243a">北京邮电大学（仅展示）· 硕士 · 2025 年已毕业 · 非在校 · 可连续实习 6 个月 · 每周出勤 5 天</text>
  <text x="176" y="804" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" fill="#7c8ba1">学校不参与门槛评分；毕业月份未提供，不推测月份。</text>

  <line x1="176" y1="832" x2="1712" y2="832" stroke="#e6ecf4" stroke-width="2"/>

  <text x="176" y="878" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#215ec4">判定原则</text>
  <text x="176" y="918" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#4c5b73">优先/加分 ≠ 硬门槛 · 相关专业优先不放松同句学历 · 多条硬下界取最严 · 信息不足不猜测 · 入口停在登录前</text>

  <!-- 页脚 -->
  <text x="128" y="1022" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" fill="#93a1b5">Lexmount 云平台真实任务挑战 · 规则 0.1.13 · 70 项离线测试通过</text>
  <text x="1792" y="1022" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#3169ce">github.com/shanshiang32/applycheck</text>
</svg>
